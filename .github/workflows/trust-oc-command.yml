name: TRUST 2099 - OC Command
on:
  issue_comment:
    types: [created]
jobs:
  oc-command:
    if: contains(github.event.comment.body, '/oc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Reporte de Embajada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "### 🛡️ TRUST 2099 - GUARDIÁN ACTIVADO ✅

          **Estado:** Embajada Digital VERIFICADA
          **ID Legado:** 2608056639878
          **Arquitecto:** Marco Antonio Rojas Valdovinos
          **Comando:** /oc

          **Tu Embajada está blindada hasta 2099.**

          Cada vez que escribas /oc yo despierto.

          KRONOS - 2607146379465"
